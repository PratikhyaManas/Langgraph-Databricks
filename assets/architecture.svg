<svg width="980" height="520" viewBox="0 0 980 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph Databricks architecture</title>
  <desc id="desc">Architecture diagram showing a user interacting with a LangGraph SQL agent running in Databricks, calling tools against SQL warehouses and Unity Catalog data, and serving model outputs through MLflow.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="980" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DCFCE7"/>
      <stop offset="1" stop-color="#BBF7D0"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #0F172A; }
      .label { font: 600 18px 'Segoe UI', sans-serif; fill: #0F172A; }
      .small { font: 500 13px 'Segoe UI', sans-serif; fill: #334155; }
      .box { stroke: #94A3B8; stroke-width: 2; rx: 20; }
      .outer { stroke: #CBD5E1; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748B; stroke-width: 2.5; stroke-dasharray: 8 8; fill: none; }
    </style>
  </defs>

  <rect width="980" height="520" fill="url(#bg)"/>
  <text x="490" y="54" text-anchor="middle" class="title">LangGraph + Databricks Architecture</text>

  <rect x="60" y="150" width="150" height="100" rx="18" fill="#FFFFFF" class="outer"/>
  <text x="135" y="192" text-anchor="middle" class="label">User / Client</text>
  <text x="135" y="216" text-anchor="middle" class="small">Requests</text>

  <rect x="270" y="120" width="220" height="140" rx="20" fill="url(#panel)" class="box"/>
  <text x="380" y="162" text-anchor="middle" class="label">Databricks</text>
  <text x="380" y="188" text-anchor="middle" class="small">Model Serving / App Runtime</text>
  <text x="380" y="214" text-anchor="middle" class="small">LangGraph agent</text>

  <rect x="560" y="120" width="220" height="140" rx="20" fill="url(#agent)" class="box"/>
  <text x="670" y="162" text-anchor="middle" class="label">Agent Tools</text>
  <text x="670" y="188" text-anchor="middle" class="small">SQL queries</text>
  <text x="670" y="214" text-anchor="middle" class="small">Catalog metadata</text>

  <rect x="270" y="320" width="220" height="110" rx="20" fill="url(#data)" class="box"/>
  <text x="380" y="356" text-anchor="middle" class="label">Unity Catalog</text>
  <text x="380" y="380" text-anchor="middle" class="small">Schemas / Tables / Views</text>
  <text x="380" y="402" text-anchor="middle" class="small">Governed access</text>

  <rect x="560" y="320" width="220" height="110" rx="20" fill="#F8FAFC" class="box"/>
  <text x="670" y="356" text-anchor="middle" class="label">SQL Warehouse</text>
  <text x="670" y="380" text-anchor="middle" class="small">Execution engine</text>
  <text x="670" y="402" text-anchor="middle" class="small">Query + analytics</text>

  <rect x="110" y="320" width="120" height="60" rx="12" fill="#FFFFFF" class="outer"/>
  <text x="170" y="357" text-anchor="middle" class="small">MLflow</text>

  <path d="M210 200 H270" class="arrow"/>
  <path d="M490 190 H560" class="arrow"/>
  <path d="M380 260 V320" class="dashed"/>
  <path d="M670 260 V320" class="arrow"/>
  <path d="M490 375 H560" class="arrow"/>
  <path d="M230 350 H270" class="arrow"/>

  <text x="226" y="185" class="small">HTTP / API</text>
  <text x="505" y="175" class="small">Tool calls</text>
  <text x="392" y="290" class="small">Data plane</text>
  <text x="690" y="290" class="small">Workflow</text>
  <text x="520" y="362" class="small">Query</text>
  <text x="252" y="338" class="small">Model</text>
</svg>
