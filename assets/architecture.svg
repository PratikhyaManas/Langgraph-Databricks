<svg width="980" height="520" viewBox="0 0 980 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph Databricks architecture</title>
  <desc id="desc">Architecture diagram showing a user interacting with a LangGraph SQL agent running in Databricks, calling tools against SQL warehouses and Unity Catalog data, and serving model outputs through MLflow.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="980" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DCFCE7"/>
      <stop offset="1" stop-color="#BBF7D0"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #0F172A; }
      .label { font: 600 18px 'Segoe UI', sans-serif; fill: #0F172A; }
      .small { font: 500 13px 'Segoe UI', sans-serif; fill: #334155; }
      .box { stroke: #94A3B8; stroke-width: 2; rx: 20; }
      .outer { stroke: #CBD5E1; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748B; stroke-width: 2.5; stroke-dasharray: 8 8; fill: none; }
    </style>
  </defs>

  <rect width="980" height="520" fill="url(#bg)"/>
  <text x="490" y="54" text-anchor="middle" class="title">LangGraph + Databricks Architecture</text>

  <rect x="60" y="110" width="150" height="100" rx="18" fill="#FFFFFF" class="outer"/>
  <text x="135" y="150" text-anchor="middle" class="label">User / Client</text>
  <text x="135" y="176" text-anchor="middle" class="small">Requests</text>

  <rect x="290" y="90" width="220" height="140" rx="20" fill="url(#panel)" class="box"/>
  <text x="400" y="130" text-anchor="middle" class="label">Databricks</text>
  <text x="400" y="158" text-anchor="middle" class="small">Model Serving / App Runtime</text>
  <text x="400" y="184" text-anchor="middle" class="small">LangGraph agent</text>

  <rect x="600" y="90" width="230" height="140" rx="20" fill="url(#agent)" class="box"/>
  <text x="715" y="130" text-anchor="middle" class="label">Agent Tools</text>
  <text x="715" y="158" text-anchor="middle" class="small">SQL queries</text>
  <text x="715" y="184" text-anchor="middle" class="small">Catalog metadata</text>

  <rect x="320" y="300" width="260" height="115" rx="20" fill="url(#data)" class="box"/>
  <text x="450" y="338" text-anchor="middle" class="label">Unity Catalog</text>
  <text x="450" y="364" text-anchor="middle" class="small">Schemas / Tables / Views</text>
  <text x="450" y="390" text-anchor="middle" class="small">Governed data access</text>

  <rect x="660" y="300" width="200" height="115" rx="20" fill="#F8FAFC" class="box"/>
  <text x="760" y="338" text-anchor="middle" class="label">SQL Warehouse</text>
  <text x="760" y="364" text-anchor="middle" class="small">Execution engine</text>
  <text x="760" y="390" text-anchor="middle" class="small">Query + analytics</text>

  <path d="M210 160 H290" class="arrow"/>
  <path d="M510 160 H600" class="arrow"/>
  <path d="M715 230 V300" class="arrow"/>
  <path d="M580 360 H660" class="arrow"/>
  <path d="M400 230 V300" class="dashed"/>

  <text x="245" y="147" class="small">HTTP / API</text>
  <text x="545" y="147" class="small">Tool calls</text>
  <text x="725" y="270" class="small">Workflow</text>
  <text x="620" y="346" class="small">Query</text>
  <text x="410" y="280" class="small">Data plane</text>

  <g>
    <rect x="100" y="260" width="120" height="60" rx="12" fill="#FFFFFF" class="outer"/>
    <text x="160" y="297" text-anchor="middle" class="small">MLflow</text>
  </g>
  <path d="M220 290 H320" class="arrow"/>
  <text x="250" y="280" class="small">Model</text>
</svg>
