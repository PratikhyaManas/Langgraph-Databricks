<svg width="980" height="520" viewBox="0 0 980 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph Databricks architecture</title>
  <desc id="desc">Architecture diagram showing a user interacting with a LangGraph SQL agent running in Databricks, calling tools against SQL warehouses and Unity Catalog data, and serving model outputs through MLflow.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="980" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DCFCE7"/>
      <stop offset="1" stop-color="#BBF7D0"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #0F172A; }
      .label { font: 600 18px 'Segoe UI', sans-serif; fill: #0F172A; }
      .small { font: 500 13px 'Segoe UI', sans-serif; fill: #334155; }
      .box { stroke: #94A3B8; stroke-width: 2; }
      .outer { stroke: #CBD5E1; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748B; stroke-width: 2.5; stroke-dasharray: 8 8; fill: none; }
    </style>
  </defs>

  <rect width="980" height="520" fill="url(#bg)"/>
  <text x="490" y="54" text-anchor="middle" class="title">LangGraph + Databricks Architecture</text>

  <rect x="70" y="150" width="160" height="100" rx="18" fill="#FFFFFF" class="outer"/>
  <text x="150" y="192" text-anchor="middle" class="label">User / Client</text>
  <text x="150" y="216" text-anchor="middle" class="small">Requests</text>

  <rect x="300" y="120" width="220" height="140" rx="20" fill="url(#panel)" class="box"/>
  <text x="410" y="162" text-anchor="middle" class="label">Databricks</text>
  <text x="410" y="188" text-anchor="middle" class="small">Model Serving / App Runtime</text>
  <text x="410" y="214" text-anchor="middle" class="small">LangGraph agent</text>

  <rect x="610" y="120" width="220" height="140" rx="20" fill="url(#agent)" class="box"/>
  <text x="720" y="162" text-anchor="middle" class="label">Agent Tools</text>
  <text x="720" y="188" text-anchor="middle" class="small">SQL queries</text>
  <text x="720" y="214" text-anchor="middle" class="small">Catalog metadata</text>

  <rect x="300" y="320" width="220" height="110" rx="20" fill="#F8FAFC" class="box"/>
  <text x="410" y="356" text-anchor="middle" class="label">MLflow</text>
  <text x="410" y="382" text-anchor="middle" class="small">Model registry</text>
  <text x="410" y="404" text-anchor="middle" class="small">Versioning / deploy</text>

  <rect x="70" y="320" width="220" height="110" rx="20" fill="url(#data)" class="box"/>
  <text x="180" y="356" text-anchor="middle" class="label">Unity Catalog</text>
  <text x="180" y="382" text-anchor="middle" class="small">Schemas / Tables / Views</text>
  <text x="180" y="404" text-anchor="middle" class="small">Governed access</text>

  <rect x="610" y="320" width="220" height="110" rx="20" fill="#F8FAFC" class="box"/>
  <text x="720" y="356" text-anchor="middle" class="label">SQL Warehouse</text>
  <text x="720" y="382" text-anchor="middle" class="small">Execution engine</text>
  <text x="720" y="404" text-anchor="middle" class="small">Query + analytics</text>

  <path d="M230 200 H300" class="arrow"/>
  <path d="M520 190 H610" class="arrow"/>
  <path d="M410 260 V320" class="arrow"/>
  <path d="M290 375 H610" class="dashed"/>
  <path d="M720 260 V320" class="arrow"/>

  <text x="250" y="184" class="small">HTTP / API</text>
  <text x="550" y="175" class="small">Tool calls</text>
  <text x="421" y="286" class="small">Serve / track</text>
  <text x="382" y="312" class="small">Model</text>
  <text x="396" y="354" class="small">Data</text>
  <text x="640" y="286" class="small">Query</text>
</svg>
