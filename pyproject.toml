[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-databricks"
version = "0.1.0"
description = "A LangGraph SQL workflow agent for Databricks Model Serving"
requires-python = ">=3.11"
dependencies = [
	"databricks-sdk>=0.30.0",
	"databricks-sql-connector>=3.4.0",
	"langchain-community>=0.3.0",
	"langgraph>=1.0.0,<2.0.0",
	"mlflow>=2.17.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
	"pytest>=8.0.0",
	"ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
